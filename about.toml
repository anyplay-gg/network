# cargo about: the licences of the third-party crates in a release build of the net service.
# The launcher, which carries the net service, merges this list into its THIRD-PARTY-LICENSES.txt.
# Our own crates are not published and left out.
#
# The order is the preference when a crate offers a choice. deny.toml decides what is allowed at
# all.
accepted = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
workarounds = ["ring", "rustls"]

[private]
ignore = true
