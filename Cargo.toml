[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/anyplaynet/network"
rust-version = "1.91"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Dependencies run at a usable speed in debug builds. It also keeps windows-gnu able to link
# iroh, which is a cdylib as well: unoptimized, it would export more symbols than a DLL holds.
[profile.dev.package."*"]
opt-level = 2

# The picture code is per pixel: in a debug build the tests of a real stream would crawl.
[profile.dev.package.anyplay-share]
opt-level = 2

[profile.dev.package.anyplay-share-worker]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The echo canceller runs 100 blocks a second and is far too slow unoptimised for the tests that
# feed it tens of seconds of audio.
[profile.dev.package.sonora]
opt-level = 3

[profile.dev.package.sonora-aec3]
opt-level = 3

[profile.dev.package.sonora-agc2]
opt-level = 3

[profile.dev.package.sonora-common-audio]
opt-level = 3

[profile.dev.package.sonora-fft]
opt-level = 3

[profile.dev.package.sonora-ns]
opt-level = 3

[profile.dev.package.sonora-simd]
opt-level = 3
