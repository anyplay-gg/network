[package]
name = "anyplay-fake-game"
description = "Plays a game's side of the bridge protocol, for tests and for trying the network without a game"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "anyplay-fake-game"
path = "src/main.rs"

[dependencies]
anyplay-bridge-protocol = { path = "../bridge-protocol" }
rand = "0.10"
serde_json.workspace = true
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
