[package]
name = "anyplay-share-worker"
description = "The share worker of the AnyPlay network: captures, encodes, decodes and shows a shared screen for the net service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "anyplay_share_worker"

[[bin]]
name = "anyplay-share"
path = "src/main.rs"

[dependencies]
anyplay-share = { path = "../share" }
serde.workspace = true
serde_json.workspace = true
# Clips: the MP4 file (MIT, pure Rust; docs/adr/0028).
mp4 = "0.14"
# The game's sound: Opus, as voice uses it (libopus, BSD-3-Clause; docs/adr/0014).
opus = "0.4"

# Windows: the system's own H.264 encoders and decoders (Media Foundation), Windows Graphics
# Capture of one window, and a window for the viewer. All of it ships with the system or is
# MIT or Apache-2.0 (docs/adr/0027).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }
windows-capture = "2"

# Linux: the desktop portal's ScreenCast (the player picks the game's window in the system's
# own dialog) through ashpd (MIT), on a small tokio runtime of its own.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
tokio = { version = "1.54", features = ["rt", "time"] }
# The window's pictures from PipeWire (MIT; links the system's libpipewire, MIT).
pipewire = "0.10"
# Software H.264 from Cisco's OpenH264 binary, loaded at run time and checked by its hash
# (BSD-2-Clause; docs/adr/0027). Nothing of OpenH264 is built into the worker.
openh264 = { version = "0.9", default-features = false, features = ["libloading"] }
openh264-sys2 = { version = "0.9", default-features = false, features = ["libloading"] }

# The viewer's window (MIT or Apache-2.0), on Windows and on Linux (X11 and Wayland).
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
minifb = "0.28"

[dev-dependencies]
anyplay-control = { path = "../control" }
anyplay-net = { path = "../net" }
iroh = "1.4.1"
iroh-relay = { version = "1.4.1", features = ["server"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
