[package]
name = "anyplay-share-worker"
description = "The share worker of the AnyPlay network: captures, encodes, decodes and shows a shared screen for the net service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "anyplay_share_worker"

[[bin]]
name = "anyplay-share"
path = "src/main.rs"

[dependencies]
anyplay-share = { path = "../share" }
serde_json.workspace = true

# Windows: the system's own H.264 encoders and decoders (Media Foundation), Windows Graphics
# Capture of one window, and a window for the viewer. All of it ships with the system or is
# MIT or Apache-2.0 (docs/adr/0027).
[target.'cfg(windows)'.dependencies]
minifb = "0.28"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }
windows-capture = "2"

[dev-dependencies]
anyplay-control = { path = "../control" }
anyplay-net = { path = "../net" }
iroh = "1.4.1"
iroh-relay = { version = "1.4.1", features = ["server"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
