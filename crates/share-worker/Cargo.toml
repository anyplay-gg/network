[package]
name = "anyplay-share-worker"
description = "The share worker of the AnyPlay network: captures, encodes, decodes and shows a shared screen for the net service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "anyplay_share_worker"

[[bin]]
name = "anyplay-share"
path = "src/main.rs"

[features]
# A window for the viewer, through minifb (MIT or Apache-2.0). Off by default: on Linux it needs
# the display libraries at run time, and the tests have no use for it.
window = ["dep:minifb"]
# Capture of the game's window, through Windows Graphics Capture. Windows only.
capture = ["dep:windows-capture"]

[dependencies]
anyplay-share = { path = "../share" }
minifb = { version = "0.28", optional = true }
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-capture = { version = "2", optional = true }

[dev-dependencies]
anyplay-control = { path = "../control" }
anyplay-net = { path = "../net" }
iroh = "1.4.1"
iroh-relay = { version = "1.4.1", features = ["server"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
