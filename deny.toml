# What the crates of this repository may depend on (cargo-deny). The network's crates are MIT OR
# Apache-2.0, and the bridge protocol is also used by GPL-2.0 code, so every dependency must allow
# use under both.

[graph]
all-features = true
# Only what we build: the wasm crates of iroh never reach a binary of ours.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
# A vulnerability anywhere fails the check; an unmaintained crate only when we depend on it
# directly. An exception names its ID and why it does not apply.
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
    "MPL-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
